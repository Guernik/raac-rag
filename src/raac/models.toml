# Model per pipeline stage (ADR 0002). Changing a model is an eval-gated change.
# Override one stage at runtime with RAAC_MODEL_<STAGE>, e.g. RAAC_MODEL_SEARCH=claude-sonnet-5-5.

indexing = "claude-haiku-4-5"  # PageIndex node summaries and tree refinement
routing = "claude-haiku-4-5"   # Parte routing over titles and root summaries
search = "claude-opus-5-5"     # PageIndex tree search
answer = "claude-opus-5-5"     # Answer with the Citations API

# Eval only, not a pipeline stage: correctness judge against reference Answers (RAAC_MODEL_JUDGE overrides).
judge = "claude-opus-5-5"
