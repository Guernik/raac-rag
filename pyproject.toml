# Commands (uv):
#   install:  uv sync
#   test:     uv run pytest
#   run:      uv run raac ask "¿Puedo volar VFR de noche con mi licencia de piloto privado?"
#             (Partes 1, 61, 67, 91 by default; --parte X to pick; --json shows routed Partes and visited nodes;
#              needs ANTHROPIC_API_KEY, from the environment or a .env file: cp .env.example .env;
#              models per stage in src/raac/models.toml)
#   eval:     uv run raac eval   (cases in evals/cases.jsonl; report in evals/reports/; --no-judge skips the correctness judge)
#   routing:  uv run raac route --cases evals/routing-cases.jsonl
#   cases:    uv run raac generate-cases --parte 61 -n 5   (or --pdf path/to/parte.pdf; writes evals/candidates.jsonl)
#             uv run raac review   (accept/edit/reject each pending candidate; accepted ones join evals/cases.jsonl)

[project]
name = "raac-rag"
version = "0.1.0"
description = "Grounded, cited answers over the RAAC vigente"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "httpx>=0.27",
    "pageindex>=0.2.21",
    "pymupdf>=1.26",
    "python-dotenv>=1.2.4",
]

[project.scripts]
raac = "raac.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
